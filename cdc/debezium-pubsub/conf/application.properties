# Debezium Server: Neon Postgres -> Google Cloud Pub/Sub
# Host, user, password, dbname and the GCP project ID are injected as environment
# variables by docker-compose.yml (see .env), so they are intentionally absent here.

# --- Sink: Google Cloud Pub/Sub ---
debezium.sink.type=pubsub

# --- Source: Postgres logical replication ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.port=5432
debezium.source.database.sslmode=require

# Topic names are <topic.prefix>.<schema>.<table>, e.g. snippets.public.customers
debezium.source.topic.prefix=snippets
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.customers

# Slot is created by Debezium on first start. The publication is created by sql/setup.sql.
debezium.source.slot.name=debezium_snippets
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled

# Snapshot existing rows once (op "r"), then stream changes.
debezium.source.snapshot.mode=initial

# Offsets are stored in a file on the dbz-data volume so Debezium resumes after a restart.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# Don't emit a null "tombstone" message after each delete (not useful for Pub/Sub).
debezium.source.tombstones.on.delete=false

# --- Output format: plain JSON, without the embedded schema ---
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

quarkus.log.console.json=false
